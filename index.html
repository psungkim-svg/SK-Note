<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f3f5">
<title>SK 노트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f2f3f5; --bg2:#e9eaee; --card:#ffffff; --text:#212121; --sub:#757575;
  --line:#c9ccd2; --accent:#f5a623; --accent2:#e8910d; --bar:#ffffff; --chip:#ececec;
  --danger:#e53935; --ok:#43a047; --shadow:0 1px 3px rgba(0,0,0,.12);
  --fs:18px; --boxmin:165px;
}
html[data-theme="dark"]{
  --bg:#15161a; --bg2:#1c1e24; --card:#242629; --text:#ececec; --sub:#9aa0a6;
  --line:#33363c; --bar:#1c1e24; --chip:#2e3138; --accent2:#ffb300;
  --shadow:0 1px 4px rgba(0,0,0,.5);
}
/* ▼ 5단계 글자 크기 (매우작게 = 구 버전 '크게' 기준) */
html[data-fontsize="xs"]{--fs:13.3px} html[data-fontsize="s"]{--fs:17.3px}
html[data-fontsize="m"]{--fs:21.3px} html[data-fontsize="l"]{--fs:25.3px} html[data-fontsize="xl"]{--fs:29.3px}
/* ▼ 노트박스: 한 줄에 2/3/4개 */
html[data-cols="2"]{--cols:2} html[data-cols="3"]{--cols:3} html[data-cols="4"]{--cols:4}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
html,body{margin:0;padding:0}
/* ▼ 한글 Horizontal Scale 90% */
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;
  background:var(--bg); color:var(--text); font-size:var(--fs);
  letter-spacing:0;
  font-stretch:90%;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit; cursor:pointer}
input,textarea{font-family:inherit}
.iconbtn{background:none;border:none;color:var(--text);padding:.4em;border-radius:.4em;font-size:.95em;line-height:1}
.iconbtn:active{background:var(--chip)}
.iconbtn.on{filter:drop-shadow(0 0 4px var(--ok))}

/* ── 상단 바 ── */
header{
  position:sticky;top:0;z-index:30;background:var(--bar);
  box-shadow:var(--shadow); padding:.4em .5em;
  padding-top:calc(.4em + env(safe-area-inset-top));
}
.hrow{display:flex;align-items:center;gap:.3em}
.logo{font-weight:800;font-size:.9em;color:var(--text);margin-right:.2em;white-space:nowrap}
#search{
  flex:1;min-width:0;background:var(--chip);border:none;border-radius:1.2em;
  padding:.4em .8em;font-size:.72em;color:var(--text);outline:none
}
#search::placeholder{color:var(--sub)}
.syncdot{width:.5em;height:.5em;border-radius:50%;background:#9aa0a6;flex:none;display:inline-block}
.syncdot.ok{background:var(--ok)} .syncdot.syncing{background:var(--accent);animation:pulse 1s infinite}
.syncdot.err{background:var(--danger)}
@keyframes pulse{50%{opacity:.35}}

/* 폴더 바 */
.folderbar{display:flex;gap:.3em;overflow-x:auto;padding:.4em .1em .1em;scrollbar-width:none}
.folderbar::-webkit-scrollbar{display:none}
.chip{
  flex:none;background:var(--chip);color:var(--text);border:none;border-radius:1em;
  padding:.32em .7em;font-size:.66em;font-weight:600;white-space:nowrap
}
.chip.on{background:var(--accent);color:#3d2c00}
.chip.trash.on{background:var(--danger);color:#fff}

/* ── 노트 목록 (간격 없음, 라운드 없음, 1px 메쉬) ── */
main{padding:8px;max-width:1000px;margin:0 auto}
#grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--boxmin),1fr));
  gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)
}
#grid.titles{display:flex;flex-direction:column}
#grid.titles .tinner{display:none}
#grid.list{display:flex;flex-direction:column}
.note{
  background:var(--nc,var(--card));
  border:none;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  border-radius:0;padding:0;display:flex;flex-direction:column;
  position:relative;overflow:hidden;word-break:break-word
}
.note .thead{
  background:var(--tc,var(--chip));
  padding:.2em .5em;display:flex;align-items:center;gap:.3em;min-height:0
}
.note .ttl{font-weight:800;font-size:.8em;line-height:1.15;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note .badges{font-size:.6em;display:flex;gap:.25em;flex:none}
.note .tinner{padding:.4em .55em .5em;display:flex;flex-direction:column;gap:.3em;flex:1}
.note{transition:transform .15s ease}
.note:active{transform:scale(.97)}
.note.sel{outline:3px solid var(--accent);outline-offset:-3px}
.note .selbadge{
  position:absolute;top:.2em;left:.2em;width:1.25em;height:1.25em;border-radius:50%;
  background:var(--accent);color:#3d2c00;font-size:.55em;font-weight:900;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.3);
  animation:popIn .18s ease-out
}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
.chip{transition:background .18s ease, transform .12s ease}
.chip:active{transform:scale(.94)}
.note .body{font-size:.68em;color:var(--text);opacity:.85;flex:1;overflow:hidden;line-height:1.45;max-height:6.5em}
.note .body.blur{filter:blur(.3em);user-select:none}
.note .meta{font-size:.58em;color:var(--sub);display:flex;gap:.4em;align-items:center}
.note .prog{font-size:.58em;color:var(--sub)}
.empty{color:var(--sub);text-align:center;padding:3em 1em;font-size:.8em}
.hidden{display:none!important}

/* ── 플로팅 버튼 (글자 크기 유지, 박스 50% 축소) ── */
#fab:active,#vFab:active{transform:scale(.88)}
#fab,#vFab{
  transition:transform .15s ease;
  position:fixed;right:.9em;bottom:calc(.9em + env(safe-area-inset-bottom));z-index:20;
  width:1.55em;height:1.55em;padding:0;line-height:1;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:none;background:var(--accent);
  color:#3d2c00;font-size:1.5em;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.3)
}
/* 타입 선택 세그먼트 */
.seg{display:flex;gap:.2em;margin-bottom:.4em}
.segbtn{
  flex:1;background:var(--chip);border:none;color:var(--text);border-radius:.4em;
  padding:.35em;font-size:.72em;font-weight:700
}
.segbtn.on{background:var(--accent);color:#3d2c00}
/* 보관 노트 */
.vhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5em}
.vhead .logo{font-size:.9em}
.vgrid{
  display:grid;grid-template-columns:repeat(var(--cols,2),1fr);
  gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)
}
.vgrid.list{display:flex;flex-direction:column}
.vgrid.titles{display:flex;flex-direction:column}
.vgrid.titles .tinner{display:none}

/* ── 모달 공통 ── */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;
  align-items:flex-end;justify-content:center;
  animation:ovIn .22s ease-out
}
.overlay.closing{animation:ovOut .18s ease-in forwards}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
@keyframes ovOut{from{opacity:1}to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(28px);opacity:.4}to{transform:translateY(0);opacity:1}}
@media(min-width:640px){.overlay{align-items:center}}
.sheet{
  background:var(--bg2);width:100%;max-width:640px;max-height:92vh;overflow:auto;
  border-radius:18px 18px 0 0;padding:.8em .8em calc(1em + env(safe-area-inset-bottom));
  animation:sheetUp .26s cubic-bezier(.2,.8,.3,1)
}
@media(min-width:640px){.sheet{border-radius:18px}}
.sheet h3{margin:.2em 0 .7em;font-size:.85em;display:flex;align-items:center;justify-content:space-between}
.btn{
  background:var(--chip);color:var(--text);border:none;border-radius:.5em;
  padding:.5em .8em;font-size:.75em;font-weight:600
}
.btn.primary{background:var(--accent);color:#3d2c00}
.btn.danger{background:var(--danger);color:#fff}
.btnrow{display:flex;gap:.4em;flex-wrap:wrap;margin-top:.5em}

/* ── 에디터 ── */
.swatch{width:1.5em;height:1.5em;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.swatch.on{border:3px solid var(--text)}
#edTitle{
  width:100%;background:transparent;border:none;outline:none;font-size:1.05em;font-weight:800;
  color:var(--text);padding:.2em 0;border-bottom:1px solid var(--line);margin-bottom:.3em
}
.tb{
  background:var(--chip);border:none;color:var(--text);border-radius:.4em;
  min-width:1.8em;height:1.8em;font-size:.75em;font-weight:700
}
.tb.b{font-weight:900}.tb.i{font-style:italic}.tb.u{text-decoration:underline}.tb.s{text-decoration:line-through}
.pal{position:relative}
.palpop{
  position:absolute;top:2em;left:0;z-index:60;background:var(--card);border:1px solid var(--line);
  border-radius:.5em;box-shadow:var(--shadow);padding:.4em;display:flex;gap:.2em;flex-wrap:wrap;width:11em
}
.palpop button{width:1.3em;height:1.3em;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
#edBody{
  background:var(--card);border:1px solid var(--line);border-radius:.6em;min-height:11em;
  padding:.6em;font-size:.84em;line-height:1.6;outline:none;color:var(--text);overflow:auto
}
#edBody:empty:before{content:attr(data-ph);color:var(--sub)}
#edBody b,#edBody strong{font-weight:800}
.itemrow{display:flex;align-items:center;gap:.4em;padding:.35em .4em;background:var(--card);border:1px solid var(--line);border-radius:.5em;margin-bottom:.3em}
.itemrow input[type=checkbox]{width:1.1em;height:1.1em;accent-color:var(--accent);flex:none}
.itemrow .itxt{flex:1;font-size:.8em;border:none;background:transparent;color:var(--text);outline:none}
.itemrow .itxt.done{text-decoration:line-through;color:var(--sub)}
.itemrow .mv{background:var(--chip);border:none;border-radius:.3em;width:1.4em;height:1.4em;font-size:.6em;color:var(--text)}
.edfoot{display:flex;gap:.3em;margin-top:.5em;flex-wrap:wrap}


/* ── 전체화면 에디터 ── */
#edOverlay{align-items:stretch}
#edOverlay .sheet{
  position:fixed;top:0;left:0;right:0;bottom:0;
  width:100%;height:100vh;height:100dvh;
  max-width:100%;max-height:100%;border-radius:0;padding:0;margin:0;
  display:flex;flex-direction:column;background:var(--bg);
  animation:ovIn .2s ease-out
}
.edbar{
  flex:none;display:flex;align-items:center;gap:.35em;
  padding:calc(.35em + env(safe-area-inset-top)) .5em .3em;
  border-bottom:1px solid var(--line);background:var(--bar)
}
#edTitle{
  flex:1;min-width:0;background:transparent;border:none;outline:none;
  font-size:.9em;font-weight:800;color:var(--text);padding:.3em .2em
}
.edtool{
  flex:none;width:1.7em;height:1.7em;border:none;border-radius:.45em;background:var(--chip);
  color:var(--text);font-size:.85em;display:flex;align-items:center;justify-content:center;
  transition:transform .12s ease, background .15s ease
}
.edtool:active{transform:scale(.88)}
.edtool.on{background:var(--accent);color:#3d2c00}
.cbox{width:1.25em;height:1.25em;border-radius:.25em;border:1px solid rgba(0,0,0,.2)}
.cpop{
  position:fixed;top:3em;right:.5em;z-index:90;background:var(--card);border:1px solid var(--line);
  border-radius:.7em;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:.5em;display:flex;gap:.4em;
  animation:popIn .16s ease-out
}
.cpop button{width:1.6em;height:1.6em;border-radius:.3em;border:1px solid rgba(0,0,0,.15)}
#edWrap{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#edBody{
  flex:1;width:100%;background:var(--bg);border:none;border-radius:0;
  min-height:0;padding:.55em .6em calc(1em + env(safe-area-inset-bottom));
  font-size:.85em;line-height:1.65;outline:none;color:var(--text);overflow:auto;
  -webkit-user-select:text;user-select:text
}
#edItems{flex:1;overflow:auto;padding:.5em .6em 25vh}
.bub{
  position:fixed;z-index:95;background:var(--card);border:1px solid var(--line);border-radius:.5em;
  box-shadow:0 4px 14px rgba(0,0,0,.25);padding:.25em .35em;display:flex;gap:.2em;
  animation:popIn .15s ease-out
}
.bub button{width:1.9em;height:1.9em;border:none;border-radius:.35em;background:var(--chip);
  font-weight:900;color:var(--text);font-size:.8em}
.menuline{
  display:flex;align-items:center;gap:.6em;width:100%;text-align:left;
  background:none;border:none;color:var(--text);font-size:.82em;font-weight:600;
  padding:.75em .5em;border-bottom:1px solid var(--line)
}
.menuline:active{background:var(--chip)}
.menuline .mi{font-size:1.15em;width:1.4em;text-align:center}
#edSaved{position:fixed;bottom:.6em;left:50%;transform:translateX(-50%);z-index:5;
  font-size:.58em;color:var(--sub);background:var(--chip);border-radius:1em;padding:.25em .8em;
  opacity:0;transition:opacity .3s;pointer-events:none}
#edSaved.show{opacity:.95}

/* ── 설정/계정 ── */
.setsec{background:var(--card);border:1px solid var(--line);border-radius:.6em;padding:.6em;margin-bottom:.5em}
.setsec h4{margin:0 0 .5em;font-size:.62em;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:.5em;padding:.35em 0;font-size:.78em;flex-wrap:wrap}
.setrow label{font-weight:600}
select,input[type=text],input[type=password],input[type=email]{
  background:var(--chip);color:var(--text);border:1px solid var(--line);border-radius:.4em;
  padding:.45em .5em;font-size:.75em;outline:none
}
input#acUrl,input#acKey{letter-spacing:normal}
.setrow input[type=text]{flex:1;min-width:9em}
.field{display:flex;flex-direction:column;gap:.3em;margin-bottom:.5em}
.field label{font-size:.62em;font-weight:700;color:var(--sub)}
.field input{width:100%}
.hint{font-size:.6em;color:var(--sub);line-height:1.5;margin-top:.3em}
.stat{font-size:.65em;color:var(--sub);min-height:1em}

/* ── 잠금 화면 ── */
#lock{
  position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.8em
}
#lock .lockicon{font-size:2.6em}
#lock input{
  font-size:1.1em;letter-spacing:.3em;text-align:center;width:9em;padding:.5em;
  border-radius:.5em;background:var(--chip);color:var(--text);border:1px solid var(--line);outline:none
}
#lock .btn{font-size:.8em;padding:.6em 1.5em}

/* 토스트 */
#toast{
  position:fixed;left:50%;bottom:5em;transform:translateX(-50%);z-index:120;
  background:rgba(30,30,30,.92);color:#fff;padding:.5em .9em;border-radius:1.2em;
  font-size:.68em;opacity:0;transition:opacity .25s;pointer-events:none;max-width:85vw;text-align:center
}
#toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <span class="logo">SK-Note</span>
    <input id="search" type="search" placeholder="검색...">
    <span class="syncdot" id="syncDot" title="동기화 상태"></span>
    <button class="iconbtn" id="btnView" title="보기 전환">▦</button>
    <button class="iconbtn" id="btnAccount" title="계정 · 동기화">☁️</button>
    <button class="iconbtn" id="btnTrash" title="휴지통">🗑️</button>
    <button class="iconbtn" id="btnSettings" title="설정">⚙️</button>
  </div>
  <div class="folderbar" id="folderBar"></div>
</header>

<main>
  <div id="grid"></div>
  <div id="emptyMsg" class="empty hidden"></div>
</main>

<button id="fab" title="새 노트">+</button>
<div id="toast"></div>

<!-- ───────── 노트 에디터 (전체화면) ───────── -->
<div class="overlay hidden" id="edOverlay">
  <div class="sheet">
    <div class="edbar">
      <input id="edTitle" placeholder="제목 (누르면 첫 줄이 들어갑니다)">
      <button class="edtool" id="edSaveChk" title="눌러서 저장">✓</button>
      <button class="edtool" id="edPencil" title="편집 모드">✏️</button>
      <button class="edtool" id="edColorBox" title="색상"><span class="cbox" id="edCbox"></span></button>
      <button class="edtool" id="edMore" title="더보기">⋮</button>
    </div>
    <div id="edWrap">
      <div id="edBody" contenteditable="true" data-ph="내용을 입력하세요..."></div>
      <div id="edItems" class="hidden"></div>
      <button class="btn" id="addItemBtn" style="width:100%;margin-top:.3em">+ 항목 추가</button>
    </div>
    <span id="edSaved"></span>
  </div>
</div>

<!-- 컬러 팝업 / 볼드 버블 / +메뉴 / ⋮메뉴 -->
<div class="cpop hidden" id="cPop"></div>
<div class="bub hidden" id="bBub"><button id="bBold" title="굵게">가</button></div>

<div class="overlay hidden" id="addMenu">
  <div class="sheet" style="max-width:420px">
    <h3>추가 <button class="iconbtn" data-addclose>✕</button></h3>
    <button class="menuline" data-add="note"><span class="mi">📝</span> 메모</button>
    <button class="menuline" data-add="check"><span class="mi">☑️</span> 체크리스트</button>
  </div>
</div>

<div class="overlay hidden" id="moreMenu">
  <div class="sheet" style="max-width:420px">
    <h3>노트 메뉴 <button class="iconbtn" data-moreclose>✕</button></h3>
    <div id="moreList"></div>
  </div>
</div>

<!-- ───────── 계정 · 동기화 ───────── -->
<div class="overlay hidden" id="acOverlay">
  <div class="sheet" style="max-width:440px">
    <h3>☁️ 계정 · 동기화 <button class="iconbtn" id="acClose">✕</button></h3>
    <div class="setsec" id="acCfgSec">
      <h4>서버 연결 (Supabase)</h4>
      <div class="field">
        <label for="acUrl">프로젝트 URL</label>
        <input type="text" id="acUrl" placeholder="https://xxxx.supabase.co" autocomplete="off">
      </div>
      <div class="field">
        <label for="acKey">공개 키 (anon 또는 sb_publishable)</label>
        <input type="text" id="acKey" placeholder="eyJhbGciOi... 또는 sb_publishable_..." autocomplete="off">
      </div>
      <div class="btnrow" style="margin-top:0">
        <button class="btn primary" id="acSave">저장 · 연결</button>
        <button class="btn" id="acTest">연결 테스트</button>
      </div>
      <div class="stat" id="acTestStat"></div>
    </div>
    <div class="setsec" id="acFormSec">
      <h4>계정 로그인</h4>
      <div class="field">
        <label for="acEmail">이메일</label>
        <input type="email" id="acEmail" placeholder="me@example.com" autocomplete="username">
      </div>
      <div class="field">
        <label for="acPass">비밀번호 (6자 이상)</label>
        <input type="password" id="acPass" autocomplete="current-password">
      </div>
      <div class="btnrow" style="margin-top:0">
        <button class="btn primary" id="acLogin">로그인</button>
        <button class="btn" id="acSignup">회원가입</button>
      </div>
      <div class="stat" id="acAuthStat"></div>
    </div>
    <div class="setsec hidden" id="acLoggedSec">
      <h4>내 계정</h4>
      <div class="setrow"><span id="acEmailView" style="font-weight:700"></span></div>
      <div class="setrow"><span>동기화 상태</span><span class="stat" id="acSyncState"></span></div>
      <div class="btnrow">
        <button class="btn primary" id="acSyncNow">지금 동기화</button>
        <button class="btn danger" id="acLogout">로그아웃</button>
      </div>
    </div>
  </div>
</div>

<!-- ───────── 설정 ───────── -->
<div class="overlay hidden" id="setOverlay">
  <div class="sheet">

<script>
'use strict';
/* 오류가 나면 화면에 표시 — 무음 실패 방지 */
window.addEventListener('error',e=>{try{const t=document.querySelector('#toast');if(t){t.textContent='⚠️ 오류: '+String(e.message||'').slice(0,90);t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500)}}catch(_){}});
window.addEventListener('unhandledrejection',e=>{try{const t=document.querySelector('#toast');if(t){t.textContent='⚠️ '+String(e.reason&&e.reason.message||e.reason||'').slice(0,90);t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500)}}catch(_){}});
/* ═══════════════ 저장소 폴백 ═══════════════ */
const STORE=(()=>{try{const t='__cn__';localStorage.setItem(t,'1');localStorage.removeItem(t);return localStorage}
  catch(e){const m={};return{getItem:k=>(k in m?m[k]:null),setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}})();
const SSTORE=(()=>{try{const t='__cn__';sessionStorage.setItem(t,'1');sessionStorage.removeItem(t);return sessionStorage}
  catch(e){const m={};return{getItem:k=>(k in m?m[k]:null),setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}})();

/* ═══════════════ 파스텔 5색 (우선순위 순) + 제목줄 진한색 ═══════════════ */
const COLORS =['#ffd6e0','#fff3b0','#d3f0dd','#cde6ff','#e4d6f5'];
const HEADS_L=['#f7b8ca','#f2dd8a','#abe0c3','#a9d0f2','#cbb5e8'];
const COLORS_D=['#6b4a56','#665e38','#3f5f4a','#3f586d','#584a6d'];
const HEADS_D =['#7d5a66','#78704a','#4d7159','#4d6780','#6a5a80'];
const COLOR_NAMES=['핑크','노랑','민트','하늘','라벤더'];
const TEXT_COLORS=['#212121','#e53935','#fb8c00','#f9a825','#43a047','#1e88e5','#8e24aa'];
const HI_COLORS=['#fff59d','#ffccbc','#c8e6c9','#b3e5fc','#e1bee7','transparent'];

const LS={notes:'sk.notes',folders:'sk.folders',settings:'sk.settings'};
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=> 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function isDark(){const t=S.settings.theme;return t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches)}

let S={notes:[],folders:[],settings:{}};
let ui={folder:'',nofolder:false,view:null,search:'',trash:false,editingId:null,dragId:null,noteUnlock:false,sel:new Set()};

const DEF={theme:'auto',view:'grid',sort:'color',font:'xs',box:'2',sbUrl:'',sbKey:'',autoLock:5,lastSync:0,pinHash:null};
function load(){
  /* ── v2.0(cn.*) → v2.3(sk.*) 자동 마이그레이션 ── */
  try{
    if(!STORE.getItem(LS.notes)&&STORE.getItem('cn.notes')){
      const cnNotes=JSON.parse(STORE.getItem('cn.notes')||'[]');
      cnNotes.forEach(n=>{if(n.color==null)n.color=0; if(n.color>4)n.color=n.color%5; n.remindAt=0;});
      STORE.setItem(LS.notes,JSON.stringify(cnNotes));
      STORE.setItem(LS.folders,STORE.getItem('cn.folders')||'[]');
      const o=JSON.parse(STORE.getItem('cn.settings')||'{}');
      const c=JSON.parse(STORE.getItem(LS.settings)||'{}');
      ['theme','sbUrl','sbKey'].forEach(k=>{if(o[k]!=null)c[k]=o[k]});
      if(o.view==='grid'||o.view==='list')c.view=o.view;
      if(['updated','created','title','color','manual'].includes(o.sort))c.sort=o.sort;
      c.font='xs';
      STORE.setItem(LS.settings,JSON.stringify(c));
      if(STORE.getItem('cn.sb')&&!STORE.getItem('sk.sb'))STORE.setItem('sk.sb',STORE.getItem('cn.sb'));
    }
  }catch(e){}
  try{S.notes=JSON.parse(STORE.getItem(LS.notes))||[]}catch(e){S.notes=[]}
  try{S.folders=JSON.parse(STORE.getItem(LS.folders))||[]}catch(e){S.folders=[]}
  try{Object.assign(S.settings,DEF,JSON.parse(STORE.getItem(LS.settings))||{})}catch(e){Object.assign(S.settings,DEF)}
  // 마이그레이션: 구 8색 → 5색 / 구 글자크기(s,m,l) → 새 5단계
  S.notes.forEach(n=>{ if(n.color==null)n.color=0; if(n.color>4)n.color=n.color%5; });
  if(!['xs','s','m','l','xl'].includes(S.settings.font))S.settings.font='xs';
  if(!['2','3','4'].includes(S.settings.box))S.settings.box='2';
}
function save(){ STORE.setItem(LS.notes,JSON.stringify(S.notes)); STORE.setItem(LS.folders,JSON.stringify(S.folders)); STORE.setItem(LS.settings,JSON.stringify(S.settings)); }
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
function fmtDate(ts){const d=new Date(ts);const n=new Date();const p=x=>String(x).padStart(2,'0');
  if(d.toDateString()===n.toDateString())return `오늘 ${p(d.getHours())}:${p(d.getMinutes())}`;
  return `${d.getMonth()+1}/${d.getDate()}`;}
function plain(html){
  const d=document.createElement('div');
  d.innerHTML=(html||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/(div|p|li)>/gi,'\n');
  return (d.textContent||'').replace(/\n{3,}/g,'\n\n');
}

/* ═══════════════ 뒤로 가기 (Back 키 = 이전 화면) ═══════════════ */
const OVS=[];
let suppressPop=false, lastBackHint=0;
function histPush(){ try{history.pushState({sk:1},'')}catch(e){} }
function histPop(){ if(suppressPop)return; suppressPop=true; try{history.back()}catch(e){}; setTimeout(()=>{suppressPop=false},0) }
function ovOpen(el){ if(!el.classList.contains('hidden'))return; el.classList.remove('hidden'); el.classList.remove('closing'); OVS.push(el); histPush(); }
function ovHide(el){ el.classList.add('closing'); setTimeout(()=>{el.classList.add('hidden');el.classList.remove('closing')},170) }
function ovCloseUi(el){ const i=OVS.indexOf(el); if(i>-1)OVS.splice(i,1); ovHide(el); histPop(); }
function ovCloseTop(){ const el=OVS.pop(); if(el){ovHide(el); return true} return false }
window.addEventListener('popstate',()=>{
  if(suppressPop){suppressPop=false;return}
  if(OVS.length){
    const top=OVS[OVS.length-1];
    if(top&&top.id==='edOverlay'&&!$('#edOverlay').classList.contains('hidden')){
      clearTimeout(edSaveTimer);flushEd(false);
    }
    ovCloseTop(); return }
  const now=Date.now();
  if(now-lastBackHint<2500){ lastBackHint=0; return }   // 2.5초 안에 두 번째 → 종료 허용
  lastBackHint=now; toast('뒤로 버튼을 한 번 더 누르면 종료됩니다'); histPush();
});

/* ═══════════════ 공통 다이얼로그 ═══════════════ */
function dlg(msg,opt={}){
  return new Promise(res=>{
    const ov=$('#dlg'),inp=$('#dlgInput'),ok=$('#dlgOk');
    $('#dlgMsg').textContent=msg;
    inp.classList.toggle('hidden',!opt.input);inp.value=opt.def||'';
    ok.textContent=opt.okText||'확인';
    ok.className='btn '+(opt.danger?'danger':'primary');
    ovOpen(ov);
    const done=v=>{ovCloseUi(ov);ok.onclick=null;$('#dlgNo').onclick=null;inp.onkeydown=null;document.removeEventListener('keydown',esc2);res(v)};
    const esc2=e=>{if(e.key==='Escape')done(opt.input?null:false)};
    ok.onclick=()=>done(opt.input?inp.value.trim():true);
    $('#dlgNo').onclick=()=>done(opt.input?null:false);
    inp.onkeydown=e=>{if(e.key==='Enter')done(inp.value.trim())};
    document.addEventListener('keydown',esc2);
    if(opt.input)setTimeout(()=>inp.focus(),60);
  });
}

/* ═══════════════ 해시 (보관 노트 비밀번호용) ═══════════════ */
async function sha256(str){
  if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cn:'+str));
    return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h=0x811c9dc5;for(const c of 'cn:'+str){h^=c.charCodeAt(0);h=Math.imul(h,0x01000193)>>>0}
  return 'fnv'+h.toString(16);
}
let lastAct=Date.now();
function activity(){lastAct=Date.now()}

/* ═══════════════ 렌더링 ═══════════════ */
function applyPrefs(){
  const t=S.settings.theme;
  document.documentElement.dataset.theme=isDark()?'dark':'light';
  document.documentElement.dataset.fontsize=S.settings.font||'xs';
  document.documentElement.dataset.cols=S.settings.box||'2';
}
function visibleNotes(){
  let arr=S.notes.filter(n=>ui.trash?!!n.deleted:!n.deleted);
  if(!ui.trash&&ui.nofolder)arr=arr.filter(n=>!n.folder);
  else if(!ui.trash&&ui.folder)arr=arr.filter(n=>n.folder===ui.folder);
  const q=ui.search.trim().toLowerCase();
  if(q)arr=arr.filter(n=>(n.title||'').toLowerCase().includes(q)||plain(n.content).toLowerCase().includes(q)||(n.items||[]).some(i=>(i.text||'').toLowerCase().includes(q)));
  const sort=S.settings.sort;
  arr.sort((a,b)=>{
    if(ui.trash)return b.updatedAt-a.updatedAt;
    if(sort==='updated')return (b.pinned?1:0)-(a.pinned?1:0)||b.updatedAt-a.updatedAt;
    if(sort==='created')return (b.pinned?1:0)-(a.pinned?1:0)||b.createdAt-a.createdAt;
    if(sort==='title')return (a.title||'').localeCompare(b.title||'','ko');
    if(sort==='color')return (a.color||0)-(b.color||0)||(b.pinned?1:0)-(a.pinned?1:0)||b.updatedAt-a.updatedAt;
    return (b.pinned?1:0)-(a.pinned?1:0)||(a.sortIndex||0)-(b.sortIndex||0);
  });
  return arr;
}
function render(){
  applyPrefs();
  const dark=isDark(); const PAL=dark?COLORS_D:COLORS, HEAD=dark?HEADS_D:HEADS_L;
  const bar=$('#folderBar');bar.innerHTML='';
  const all=document.createElement('button');all.className='chip'+(ui.folder===''&&!ui.nofolder&&!ui.trash?' on':'');
  all.textContent='전체';all.onclick=()=>{ui.folder='';ui.nofolder=false;ui.trash=false;render()};bar.append(all);
  const nfc=document.createElement('button');nfc.className='chip'+(ui.nofolder&&!ui.trash?' on':'');
  nfc.textContent='노트';nfc.title='폴더에 없는 노트만';
  nfc.onclick=()=>{ui.folder='';ui.nofolder=true;ui.trash=false;render()};bar.append(nfc);
  S.folders.forEach(f=>{
    const b=document.createElement('button');b.className='chip'+(ui.folder===f.id&&!ui.nofolder&&!ui.trash?' on':'');
    const cnt=S.notes.filter(n=>!n.deleted&&n.folder===f.id).length;
    b.textContent=`${f.name} (${cnt})`;b.onclick=()=>{ui.folder=f.id;ui.nofolder=false;ui.trash=false;render()};
    b.oncontextmenu=e=>{e.preventDefault();openFolderMgr()};
    bar.append(b);
  });
  const add=document.createElement('button');add.className='chip';add.textContent='+ 폴더';add.onclick=openFolderMgr;bar.append(add);
  const vault=document.createElement('button');vault.className='chip';vault.textContent='🔐 보관';vault.title='보관 노트 열기';
  vault.onclick=()=>VLT.open();bar.append(vault);
  $('#btnTrash').classList.toggle('on',ui.trash);

  const g=$('#grid');g.className=ui.view==='grid'?'':ui.view;g.innerHTML='';
  const arr=visibleNotes();
  $('#emptyMsg').classList.toggle('hidden',arr.length>0);
  $('#emptyMsg').textContent=ui.trash?'휴지통이 비었습니다':(ui.search?'검색 결과가 없습니다':(ui.folder?'이 폴더에 노트가 없습니다':'＋ 버튼을 눌러 첫 노트를 만들어보세요'));
  arr.forEach(n=>{
    const el=document.createElement('div');el.className='note';
    el.style.setProperty('--nc',PAL[n.color||0]); el.style.setProperty('--tc',HEAD[n.color||0]);
    const folder=S.folders.find(f=>f.id===n.folder);
    let body='';
    if(n.type==='check'){
      const done=(n.items||[]).filter(i=>i.done).length,tot=(n.items||[]).length;
      const prev=(n.items||[]).slice(0,4).map(i=>`${i.done?'☑':'☐'} ${esc(i.text)}`).join('<br>');
      body=`<div class="body">${prev}</div><div class="prog">☑ ${done}/${tot}</div>`;
    }else body=`<div class="body">${esc(plain(n.content).slice(0,160))}</div>`;
    el.innerHTML=`
      <div class="thead">
        <div class="ttl">${esc(n.title)||'제목 없음'}</div>
        <span class="badges">${n.pinned?'📌':''}${n.type==='check'?'☑️':''}${n.remindAt?'⏰':''}</span>
      </div>
      <div class="tinner">
        ${body}
        <div class="meta"><span>${fmtDate(n.updatedAt)}</span>${folder?`<span>·</span><span>${esc(folder.name)}</span>`:''}</div>
      </div>`;
    if(ui.sel.has(n.id)&&!ui.trash){el.classList.add('sel');
      const b=document.createElement('span');b.className='selbadge';b.textContent='✓';el.append(b)}
    if(ui.trash){
      el.onclick=async()=>{ if(await dlg('이 노트를 복원할까요?')){n.deleted=false;n.updatedAt=Date.now();n.dirty=true;touch();render();syncSoon();} };
      const del=document.createElement('button');del.className='btn danger';del.style.cssText='font-size:.6em;padding:.3em .6em;margin-top:.2em;align-self:flex-start';
      del.textContent='영구 삭제';del.onclick=async e=>{e.stopPropagation();if(await dlg('완전히 삭제합니다. 되돌릴 수 없습니다.',{danger:true,okText:'삭제'})){S.notes=S.notes.filter(x=>x.id!==n.id);SYNC.hardDelete(n.id);touch();render()}};
      el.querySelector('.tinner').append(del);
    }else{
      el.onclick=()=>{ toggleSel(n.id) };
      el.ondblclick=()=>{ ui.sel.clear(); render(); openEditor(n.id) };
    }
    if(S.settings.sort==='manual'&&!ui.trash){el.draggable=true;
      el.ondragstart=e=>{ui.dragId=n.id;e.dataTransfer.effectAllowed='move'};
      el.ondragover=e=>{e.preventDefault();el.style.outline='2px dashed var(--accent)'};
      el.ondragleave=()=>el.style.outline='';
      el.ondrop=e=>{e.preventDefault();el.style.outline='';dropBefore(n.id)};
    }
    g.append(el);
  });
}
function dropBefore(targetId){
  const from=S.notes.find(n=>n.id===ui.dragId);const to=S.notes.find(n=>n.id===targetId);
  if(!from||!to||from===to)return;
  const vis=visibleNotes();const ids=vis.map(n=>n.id);
  const fi=ids.indexOf(from.id),ti=ids.indexOf(to.id);
  ids.splice(fi,1);ids.splice(ti,0,from.id);
  ids.forEach((id,i)=>{const n=S.notes.find(x=>x.id===id);if(n.sortIndex!==i){n.sortIndex=i;n.dirty=true;n.updatedAt=Date.now()}});
  touch();render();syncSoon();
}
function touch(){save();lastAct=Date.now()}

/* ═══════════════ 에디터 (전체화면) ═══════════════ */

const AUTO_SAVE_MS=3000;   /* 3초 뒤 자동 저장 */

function newNote(type){
  const minSi=S.notes.length?Math.min(...S.notes.map(n=>n.sortIndex??0)):0;
  const n={id:uid(),folder:ui.folder,color:0,type:type||'note',title:'',content:'',items:[],pinned:false,locked:false,
    sortIndex:minSi-1,createdAt:Date.now(),updatedAt:Date.now(),deleted:false,dirty:true,remindAt:0};

}
async function openEditor(id){
  const n=S.notes.find(x=>x.id===id);if(!n)return;

function hideBub(){$('#bBub').classList.add('hidden')}
document.addEventListener('selectionchange',()=>{
  if($('#edOverlay').classList.contains('hidden'))return;
  if(!edEditMode)return hideBub();
  setTimeout(()=>{
    const sel=document.getSelection();
    if(!sel||sel.isCollapsed||!sel.rangeCount)return hideBub();
    const range=sel.getRangeAt(0);
    if(!$('#edBody').contains(range.commonAncestorContainer))return hideBub();
    const rect=range.getBoundingClientRect();
    if(!rect||(!rect.width&&!rect.height))return hideBub();
    const bub=$('#bBub');
    bub.style.left=Math.max(8,Math.min(window.innerWidth-60,rect.left+rect.width/2-20))+'px';
    bub.style.top=Math.max(8,rect.top-46)+'px';
    bub.classList.remove('hidden');
  },60);
});

/* ═══════════════ Supabase 동기화 ═══════════════ */
const SYNC={
  client:null, channel:null, uid:null, session:null, busy:false,
  cfg(){return{url:(S.settings.sbUrl||'').trim(),key:(S.settings.sbKey||'').trim()}},
  libOk(){return typeof window.supabase!=='undefined'&&!!window.supabase.createClient},
  ready(){return this.libOk()&&this.cfg().url&&this.cfg().key},
  makeClient(){
    if(!this.ready())return null;
    if(!this.client){
      try{
        this.client=window.supabase.createClient(this.cfg().url,this.cfg().key,{auth:{persistSession:true,storageKey:'sk.sb'}});
        this.client.auth.onAuthStateChange((ev,session)=>this.onAuth(ev,session));
      }catch(e){this.client=null}
    }
    return this.client;
  },
  reset(){ if(this.channel){try{this.channel.unsubscribe()}catch(e){} this.channel=null}
    this.client=null;this.session=null;this.uid=null; },
  onAuth(ev,session){
    this.session=session||null;
    if(session&&session.user){
      this.uid=session.user.id;
      this.pullAll().then(()=>this.pushDirty());
      this.subscribe();
    }else{
      this.uid=null;
      if(this.channel){try{this.channel.unsubscribe()}catch(e){} this.channel=null}
      setStatus('','미로그인');
    }
    updateAccountUI();
  },
  toRow(n){return{id:n.id,user_id:this.uid,folder:n.folder||'',color:n.color||0,type:n.type||'note',
    title:n.title||'',content:n.content||'',items:n.items||[],pinned:!!n.pinned,locked:!!n.locked,
    sort_index:n.sortIndex||0,created_at:n.createdAt||Date.now(),updated_at:n.updatedAt||Date.now(),deleted:!!n.deleted}},
  fromRow(r){return{id:r.id,folder:r.folder||'',color:(r.color||0)%5,type:r.type||'note',title:r.title||'',
    content:r.content||'',items:r.items||[],pinned:!!r.pinned,locked:!!r.locked,sortIndex:r.sort_index||0,
    createdAt:r.created_at||0,updatedAt:r.updated_at||0,deleted:!!r.deleted}},
  async pushDirty(){
    const c=this.client; if(!c||!this.session||this.busy)return;
    const dirty=S.notes.filter(n=>n.dirty);
    const folders=S.folders.filter(f=>!f._synced);
    if(!dirty.length&&!folders.length){ if(this.session) setStatus('ok'); return }
    this.busy=true;setStatus('syncing');
    try{
      if(dirty.length){
        const {error}=await c.from('notes').upsert(dirty.map(n=>this.toRow(n)));
        if(error)throw error;
        dirty.forEach(n=>n.dirty=false);
      }
      if(folders.length){
        const {error}=await c.from('folders').upsert(folders.map(f=>({id:f.id,user_id:this.uid,name:f.name,created_at:f.createdAt||Date.now()})));
        if(error)throw error;
        folders.forEach(f=>f._synced=true);
      }
      S.settings.lastSync=Date.now();save();
      setStatus('ok');
    }catch(e){ setStatus('err','동기화 실패: '+(e.message||e)) }
    this.busy=false;
  },
  async pullAll(){
    const c=this.client; if(!c||!this.session)return;
    this.busy=true;setStatus('syncing');
    try{
      const [nr,fr]=await Promise.all([
        c.from('notes').select('*').limit(5000),
        c.from('folders').select('*').limit(500)
      ]);
      if(nr.error)throw nr.error;
      const cutoff=Date.now()-30*864e5;
      (nr.data||[]).forEach(r=>{
        if(r.deleted&&r.updated_at<cutoff)return;
        const sn=this.fromRow(r);
        const local=S.notes.find(n=>n.id===sn.id);
        if(!local)S.notes.push(Object.assign(sn,{dirty:false}));
        else if(sn.updatedAt>=(local.updatedAt||0))Object.assign(local,sn,{dirty:false});
      });
      (fr.data||[]).forEach(r=>{
        const local=S.folders.find(f=>f.id===r.id);
        if(local){local.name=r.name;local._synced=true}
        else S.folders.push({id:r.id,name:r.name,createdAt:r.created_at,_synced:true});
      });
      S.notes=S.notes.filter(n=>!(n.deleted&&n.updatedAt<cutoff));
      c.from('notes').delete().eq('deleted',true).lt('updated_at',cutoff).then(()=>{},()=>{});
      S.settings.lastSync=Date.now();save();
      if($('#edOverlay').classList.contains('hidden'))render();
      setStatus('ok');
    }catch(e){ setStatus('err','불러오기 실패: '+(e.message||e)) }
    this.busy=false;
  },
  subscribe(){
    const c=this.client; if(!c||this.channel)return;
    this.channel=c.channel('sk-realtime')
      .on('postgres_changes',{event:'*',schema:'public',table:'notes'},p=>{
        if(p.eventType==='DELETE'){ const id=p.old&&p.old.id; S.notes=S.notes.filter(n=>n.id!==id);save();
          if($('#edOverlay').classList.contains('hidden'))render(); return }
        const r=p.new;if(!r)return;
        const sn=this.fromRow(r);
        const local=S.notes.find(n=>n.id===sn.id);
        if(!local)S.notes.push(Object.assign(sn,{dirty:false}));
        else if(sn.updatedAt>=(local.updatedAt||0))Object.assign(local,sn,{dirty:false});
        save();
        if($('#edOverlay').classList.contains('hidden'))render();
      })
      .on('postgres_changes',{event:'*',schema:'public',table:'folders'},p=>{
        if(p.eventType==='DELETE'){S.folders=S.folders.filter(f=>f.id!==(p.old&&p.old.id))}
        else if(p.new&&!S.folders.find(f=>f.id===p.new.id))S.folders.push({id:p.new.id,name:p.new.name,createdAt:p.new.created_at,_synced:true});
        save();
        if($('#edOverlay').classList.contains('hidden'))render();
      })
      .subscribe();
  },
  hardDelete(id){ if(this.client&&this.session) this.client.from('notes').delete().eq('id',id).then(()=>{},()=>{}) },
  deleteFolder(id){ if(this.client&&this.session) this.client.from('folders').delete().eq('id',id).then(()=>{},()=>{}) },
  async test(){
    if(!this.libOk())return{ok:false,msg:'라이브러리 로드 실패(오프라인?)'};
    if(!this.cfg().url||!this.cfg().key)return{ok:false,msg:'URL과 공개 키를 먼저 저장하세요'};
    const c=this.makeClient();if(!c)return{ok:false,msg:'클라이언트 생성 실패 (URL 확인)'};
    const {error}=await c.from('notes').select('id',{head:true,count:'exact'});
    if(error)return{ok:false,msg:error.message};
    return{ok:true,msg:'연결 성공 ✅ (테이블 OK)'};
  }
};

const VLT={
  notes:[], editingId:null, saveTimer:null, bio:false,
  load(){try{this.notes=JSON.parse(STORE.getItem('sk.vault'))||[]}catch(e){this.notes=[]}},
  persist(){STORE.setItem('sk.vault',JSON.stringify(this.notes))},
  async init(){
    this.load();
    try{ if(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()) this.bio=true }catch(e){}
    $('#vBioRow').classList.toggle('hidden',!this.bio);
  },
  open(){ ovOpen($('#vGate')) },
  show(){ ovOpen($('#vScreen')); this.render() },
  close(){ ovCloseUi($('#vScreen')) },
  lock(){ this.close(); toast('보관 노트를 잠갔습니다') },
  async unlockPass(){
    if(!S.settings.pinHash){
      const a=await dlg('보관 노트에 사용할 비밀번호를 새로 만드세요:\n(숫자 4자리 권장)',{input:true,okText:'설정'});
      if(a===null||a===undefined)return;
      if(a.length<4){toast('4자 이상 입력하세요');return}
      const b=await dlg('한 번 더 입력하세요:',{input:true,okText:'확인'});
      if(b===null||b===undefined)return;
      if(a!==b){toast('두 값이 다릅니다. 다시 시도하세요');return}
      S.settings.pinHash=await sha256(a);save();SSTORE.setItem('cnUnlocked','1');
      toast('비밀번호가 설정되었습니다');
    }
    const v=await dlg('보관 노트 비밀번호 입력:',{input:true,okText:'해제'});
    if(v===null||v===undefined)return;
    if(await sha256(v)===S.settings.pinHash){ovCloseUi($('#vGate'));this.show()}
    else toast('비밀번호가 틀렸습니다');
  },
  b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))},
  unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))},
  async unlockBio(){
    try{
      const saved=STORE.getItem('sk.vcred');
      if(!saved){
        const cred=await navigator.credentials.create({publicKey:{
          challenge:crypto.getRandomValues(new Uint8Array(32)),
          rp:{name:'SK-Note'},
          user:{id:new TextEncoder().encode('sk-user'),name:'sk',displayName:'SK-Note 사용자'},
          pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
          authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
          timeout:60000}});
        STORE.setItem('sk.vcred',this.b64(cred.rawId));
        toast('지문이 등록되었습니다');
      }else{
        await navigator.credentials.get({publicKey:{
          challenge:crypto.getRandomValues(new Uint8Array(32)),
          allowCredentials:[{type:'public-key',id:this.unb64(saved)}],
          userVerification:'required',timeout:60000}});
      }
      ovCloseUi($('#vGate')); this.show();
    }catch(e){ toast('지문 인식 실패/취소 — 비밀번호로 해제하세요') }
  },
  render(){
    const dark=isDark(); const PAL=dark?COLORS_D:COLORS, HEAD=dark?HEADS_D:HEADS_L;
    const g=$('#vGrid');g.className='vgrid'+(ui.view==='grid'?'':' '+ui.view);g.innerHTML='';
    const arr=[...this.notes].filter(n=>!n.deleted)
      .sort((a,b)=>(a.color||0)-(b.color||0)||b.updatedAt-a.updatedAt);
    $('#vEmpty').classList.toggle('hidden',arr.length>0);
    $('#vEmpty').textContent='＋ 버튼을 눌러 보관 노트를 만들어보세요';
    arr.forEach(n=>{
      const el=document.createElement('div');el.className='note';
      el.style.setProperty('--nc',PAL[n.color||0]); el.style.setProperty('--tc',HEAD[n.color||0]);
      let body='';
      if(n.type==='check'){
        const done=(n.items||[]).filter(i=>i.done).length,tot=(n.items||[]).length;
        const prev=(n.items||[]).slice(0,4).map(i=>`${i.done?'☑':'☐'} ${esc(i.text)}`).join('<br>');
        body=`<div class="body">${prev}</div><div class="prog">☑ ${done}/${tot}</div>`;
      }else body=`<div class="body">${esc(plain(n.content).slice(0,160))}</div>`;
      el.innerHTML=`
        <div class="thead"><div class="ttl">${esc(n.title)||'제목 없음'}</div>
          <span class="badges">${n.type==='check'?'☑️':''}</span></div>
        <div class="tinner">${body}
          <div class="meta"><span>${fmtDate(n.updatedAt)}</span></div></div>`;
      el.onclick=()=>this.vOpen(n.id);
      g.append(el);
    });
  },
  vNew(){
    const n={id:uid(),color:0,type:'note',title:'',content:'',items:[],
      createdAt:Date.now(),updatedAt:Date.now(),deleted:false};
    this.notes.unshift(n);this.persist();this.vOpen(n.id);
  },
  cur(){return this.notes.find(n=>n.id===this.editingId)},
  vOpen(id){
    const n=this.notes.find(x=>x.id===id);if(!n)return;
    this.editingId=id;
    $$('#vTypeSeg .segbtn').forEach(b=>b.classList.toggle('on',b.dataset.t===n.type));
    const dark=isDark(); const PAL=dark?COLORS_D:COLORS;
    const row=$('#vColorRow');row.innerHTML='';
    PAL.forEach((c,i)=>{const b=document.createElement('button');b.className='swatch'+(i===n.color?' on':'');
      b.style.background=c;b.title=COLOR_NAMES[i];
      b.onclick=()=>{n.color=i;n.updatedAt=Date.now();this.vSched();this.vOpen(id)};row.append(b)});
    $('#vTitle').value=n.title||'';
    const isCheck=n.type==='check';
    $('#vBody').classList.toggle('hidden',isCheck);
    $('#vToolbar').classList.toggle('hidden',isCheck);
    $('#vItems').classList.toggle('hidden',!isCheck);
    $('#vAddItem').classList.toggle('hidden',!isCheck);
    $('#vBody').innerHTML=n.content||'';
    this.vRenderItems(n);
    ovOpen($('#vEd'));
  },
  vSched(){
    clearTimeout(this.saveTimer);
    this.saveTimer=setTimeout(()=>{this.vFlush();this.render()},600);
  },
  vFlush(){const n=this.cur();if(!n)return;
    n.title=$('#vTitle').value;
    if(n.type==='note')n.content=$('#vBody').innerHTML;
    n.updatedAt=Date.now();this.persist();
  },
  vSwitch(t){
    const n=this.cur();if(!n||n.type===t)return;
    if(t==='check'){
      const lines=plain($('#vBody').innerHTML).split('\n').map(x=>x.trim()).filter(Boolean);
      n.type='check';n.items=lines.map(x=>({text:x,done:false}));n.content='';
    }else{
      n.type='note';n.content=(n.items||[]).map(i=>(i.done?'☑ ':'')+esc(i.text)).join('<br>');n.items=[];
    }
    n.updatedAt=Date.now();this.persist();this.vOpen(n.id);
  },
  vRenderItems(n){
    const box=$('#vItems');box.innerHTML='';
    (n.items||[]).forEach((it,idx)=>{
      const row=document.createElement('div');row.className='itemrow';
      const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!it.done;
      cb.onchange=()=>{it.done=cb.checked;this.vSched();this.vRenderItems(n)};
      const tx=document.createElement('input');tx.type='text';tx.className='itxt'+(it.done?' done':'');tx.value=it.text||'';
      tx.placeholder='항목 입력';
      tx.addEventListener('input',()=>{it.text=tx.value;this.vSched()});
      tx.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();this.vAddAt(idx+1)}});
      const del=document.createElement('button');del.className='mv';del.textContent='✕';
      del.onclick=()=>{n.items.splice(idx,1);this.vSched();this.vRenderItems(n)};
      row.append(cb,tx,del);box.append(row);
    });
  },
  vAddAt(i){const n=this.cur();n.items.splice(i,0,{text:'',done:false});this.vSched();this.vRenderItems(n);
    const inputs=$$('#vItems .itxt');if(inputs[i])inputs[i].focus()},
  vDone(){clearTimeout(this.saveTimer);this.vFlush();ovCloseUi($('#vEd'));this.render()},
  async vDelete(){
    if(!await dlg('이 보관 노트를 삭제할까요?',{danger:true,okText:'삭제'}))return;
    this.notes=this.notes.filter(n=>n.id!==this.editingId);
    this.persist();ovCloseUi($('#vEd'));this.render();
  }
};

$('#vBody').addEventListener('input',()=>VLT.vSched());
$$('#vTypeSeg .segbtn').forEach(b=>b.onclick=()=>VLT.vSwitch(b.dataset.t));
$$('#vToolbar [data-vcmd]').forEach(b=>b.onclick=()=>{$('#vBody').focus();document.execCommand(b.dataset.vcmd,false,null);VLT.vSched()});

load();
ui.view=S.settings.view||'grid';
render();
VLT.init();
applyViewBtn();
setStatus('','');
histPush();

if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
