<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- v6.1 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E1DAD3">
<title>SK Notes v6.1</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="mask-icon" href="icons/icon-maskable-512.png" color="#D7A49A">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  /* v6.1 7가지 지정 컬러 팔레트 기반 정의 */
  --ivory: #E1DAD3;
  --nude: #E4C9B6;
  --dusty: #D7A49A;
  --sage: #B8BBA3;
  --blue: #A4B1BA;
  --lavender: #C9C3DD;
  --white: #FFFFFF;

  --bg: #E1DAD3;
  --bg2: #EFEBE7;
  --card: #FFFFFF;
  --text: #2C2A29;
  --sub: #7A7572;
  --line: #D9D2CB;
  --accent: #D7A49A;
  --accent2: #C9C3DD;
  --bar: #FFFFFF;
  --chip: #F5F2EF;
  --danger: #D7A49A;
  --ok: #B8BBA3;
  --shadow: 0 2px 6px rgba(44,42,41,0.06);

  --ui: 17pt;
  --note: 14pt;
  --notefw: 500;
  --boxmin: 165px;
}
html[data-theme="dark"]{
  --bg: #1F1E1D;
  --bg2: #282625;
  --card: #2C2A29;
  --text: #EFEBE7;
  --sub: #A8A19D;
  --line: #3D3A38;
  --accent: #D7A49A;
  --accent2: #C9C3DD;
  --bar: #282625;
  --chip: #353331;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
}
html[data-notefw="300"]{--notefw:300}
html[data-notefw="400"]{--notefw:400}
html[data-notefw="500"]{--notefw:500}
html[data-notefw="700"]{--notefw:700}
html[data-notefw="900"]{--notefw:900}
html[data-cols="2"]{--cols:2} html[data-cols="3"]{--cols:3} html[data-cols="4"]{--cols:4}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{touch-action:manipulation; height:100%; overflow:hidden}
html,body{margin:0; padding:0; height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--text); font-size:var(--ui);
  letter-spacing:0; font-weight:500;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
  display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;
}
button,input,textarea,select{font-family:inherit; letter-spacing:0; font-weight:500}
input[type=text],input[type=password],input[type=email],input[type=search],textarea{
  font-size:var(--ui); font-weight:500; user-select:text; -webkit-user-select:text;
}
button{cursor:pointer}
header,#folderNav,#selMode,.edbar,.edbar *:not(#edTitle){user-select:none;-webkit-user-select:none}
.iconbtn{background:none;border:none;color:var(--text);padding:.4em;border-radius:.4em;font-size:.95em;line-height:1;transition:background .15s,transform .1s;flex:none}
.iconbtn:active{background:var(--chip);transform:translateY(1px) scale(.92)}

header{
  order:0; position:sticky; top:0; z-index:30; background:var(--bar);
  box-shadow:var(--shadow); padding:.4em .5em;
  padding-top:calc(.4em + env(safe-area-inset-top));
  flex:none;
}
#folderNav{
  order:3; bottom:0; z-index:30; background:var(--bg2);
  box-shadow:0 -1px 3px rgba(44,42,41,0.08);
  padding:.16em .5em; padding-bottom:calc(.16em + env(safe-area-inset-bottom));
  flex:none; transition:background .2s ease;
}
#folderNav .folderbar{padding:.22em .1em .02em}
#folderNav .chip{padding:.22em .55em;font-size:.58em;border-radius:.9em}
#folderNav.vault{background:var(--nude); padding:.3em .5em; padding-bottom:calc(.3em + env(safe-area-inset-bottom))}
.hrow{display:flex;align-items:center;gap:.3em;min-width:0;flex-wrap:nowrap}
.logo{font-weight:700;font-size:.72em;color:var(--text);margin-right:.25em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26%;min-width:0;flex:none}
.verbadge{font-size:.5em;color:var(--sub);font-weight:600;background:var(--chip);border-radius:.5em;padding:.15em .5em;vertical-align:middle;white-space:nowrap}

#search{
  flex:1 1 0;min-width:0;background:var(--chip);border:1px solid var(--line);border-radius:1.2em;
  padding:.4em .8em;font-size:.72em;color:var(--text);outline:none
}
#search::placeholder{color:var(--sub)}
.syncdot{width:.5em;height:.5em;border-radius:50%;background:var(--sub);flex:none;display:inline-block}
.syncdot.ok{background:var(--ok)} .syncdot.syncing{background:var(--accent);animation:pulse 1s infinite}
.syncdot.err{background:var(--danger)}
@keyframes pulse{50%{opacity:.35}}

.folderbar{display:flex;gap:.3em;overflow-x:auto;padding:.4em .1em .1em;scrollbar-width:none}
.folderbar::-webkit-scrollbar{display:none}
.chip{
  flex:none;background:var(--chip);color:var(--text);border:1px solid var(--line);border-radius:1em;
  padding:.32em .7em;font-size:.66em;font-weight:600;white-space:nowrap;transition:transform .1s,background .15s
}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--accent);color:var(--white)}
.chip.trash.on{background:var(--danger);color:var(--white)}

main{order:1;flex:1;padding:0;max-width:1000px;width:100%;margin:0 auto;overflow-y:auto;min-height:0}
#grid{
  display:grid;grid-template-columns:repeat(var(--cols,2),1fr);
  gap:1mm;padding:1mm
}
#grid.titles{display:flex;flex-direction:column;gap:1mm}
#grid.titles .note,.grid .note{aspect-ratio:auto}
#grid.titles .tinner{display:block;padding:.22em .6em .3em}
#grid.titles .note .body{font-size:11pt;-webkit-line-clamp:1;line-height:1.35;flex:none}
#grid.titles .note .prog{display:none}
#grid.titles .ttl{font-size:.8em;font-weight:700}
.note{
  background:var(--nc,var(--card));
  border:1px solid var(--line);
  border-radius:8px;padding:0;display:flex;flex-direction:column;
  position:relative;overflow:hidden;word-break:break-word;
  transition:transform .12s, box-shadow .15s, opacity .2s;
  aspect-ratio:1/1;
}
.note:active{transform:scale(.97)}
.note.sel{outline:3px solid var(--accent);outline-offset:-3px}
.note .selmark{position:absolute;top:.3em;right:.3em;width:1.4em;height:1.4em;border-radius:50%;
  background:var(--accent);color:var(--white);display:flex;align-items:center;justify-content:center;
  font-size:.7em;font-weight:700;z-index:2}
.note .thead{
  background:var(--tc,var(--chip));
  padding:.14em .5em;display:flex;align-items:center;gap:.3em;min-height:0
}
.note .ttl{font-weight:700;font-size:.8em;line-height:1.1;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note .badges{font-size:.6em;display:flex;gap:.25em;flex:none}
.note .tinner{padding:.22em .5em .28em;display:flex;flex-direction:column;gap:.12em;flex:1;overflow:hidden;min-height:0}
.note .body{font-size:12pt;color:var(--text);opacity:.9;font-weight:400;flex:1;overflow:hidden;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.empty{color:var(--sub);text-align:center;padding:3em 1em;font-size:.8em}
.hidden{display:none!important}
mark{background:var(--lavender);color:var(--text);border-radius:2px;padding:0 1px}

#folderNav{position:relative;flex:none}
#fab,#vFab{
  position:absolute;right:.7em;bottom:100%;margin-bottom:.5em;z-index:31;
  width:1.7em;height:1.7em;padding:0;line-height:1;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:none;background:var(--accent);
  color:var(--white);font-size:1.6em;font-weight:600;box-shadow:var(--shadow);
  transition:transform .15s
}
#fab:active,#vFab:active{transform:scale(.9)}

#addMenu{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.25);
  opacity:0;visibility:hidden;transition:opacity .2s}
#addMenu.show{opacity:1;visibility:visible}
#addMenu .menucard{position:absolute;right:1em;bottom:calc(4.5em + env(safe-area-inset-bottom));
  background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:.4em;min-width:12em;transform:translateY(12px) scale(.96);opacity:0;transition:transform .22s,opacity .22s}
#addMenu.show .menucard{transform:translateY(0) scale(1);opacity:1}
.menuitem{display:flex;align-items:center;gap:.6em;width:100%;background:none;border:none;color:var(--text);
  padding:.7em .8em;font-size:.8em;font-weight:600;border-radius:8px;text-align:left}
.menuitem:active{background:var(--chip)}
.menuhead{font-size:.62em;color:var(--sub);font-weight:600;padding:.4em .9em .2em}

.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;
  align-items:flex-end;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .25s ease
}
.overlay.show{opacity:1;visibility:visible}
@media(min-width:640px){.overlay{align-items:center}}
.sheet{
  background:var(--bg2);width:100%;max-width:640px;max-height:92vh;overflow:auto;
  box-sizing:border-box; border:1px solid var(--line);
  border-radius:16px 16px 0 0;padding:.8em .8em calc(1em + env(safe-area-inset-bottom));
  transform:translateY(24px);transition:transform .28s ease
}
.overlay .sheet{max-width:min(640px,calc(100vw - 1.6em))}
.overlay.show .sheet{transform:translateY(0)}
@media(min-width:640px){.sheet{border-radius:16px}}
.sheet h3{margin:.2em 0 .7em;font-size:.85em;display:flex;align-items:center;justify-content:space-between;gap:.4em}
.btn{
  background:var(--chip);color:var(--text);border:1px solid var(--line);border-radius:.5em;
  padding:.5em .8em;font-size:.75em;font-weight:600;transition:transform .1s,filter .15s
}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--accent);color:var(--white);border-color:transparent}
.btn.danger{background:var(--danger);color:var(--white);border-color:transparent}
.btnrow{display:flex;gap:.4em;flex-wrap:wrap;margin-top:.5em}

#edOverlay{
  position:fixed;inset:0;z-index:55;background:var(--bg);
  display:flex;flex-direction:column;
  font-size:var(--ui);
  transform:translateX(100%);transition:transform .28s ease;visibility:hidden
}
#edOverlay.show{transform:translateX(0);visibility:visible}
.edpanel{display:flex;flex-direction:column;height:100%;width:100%}
.edbar{
  display:flex;align-items:center;gap:.25em;
  padding:calc(.2em + env(safe-area-inset-top)) .5em .2em;
  background:var(--bar);box-shadow:var(--shadow);flex:none
}
#edTitle{
  flex:1;min-width:0;background:var(--card);border:1px solid var(--line);outline:none;
  font-size:1em;font-weight:700;color:var(--text);padding:.35em .6em;border-radius:.5em;margin-right:.3em;
  user-select:text;-webkit-user-select:text;
}
#edTitle::placeholder{color:var(--sub);font-weight:500}
.edtool{
  background:none;border:none;color:var(--text);flex:none;
  width:1.45em;height:1.45em;border-radius:.4em;font-size:.85em;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:background .15s
}
.edtool svg{width:1.25em;height:1.25em}
.edbar:not(.editmode) #edSaveBtn,.edbar:not(.editmode) #edUndo,.edbar:not(.editmode) #edTypeBtn,.edbar:not(.editmode) #edImgBtn{display:none}
.edbar.editmode #edPencil,.edbar.editmode #edColorBtn{display:none}
.edtool:active{background:var(--chip);transform:translateY(1px) scale(.9)}
#edPencil.on{color:var(--accent)}
#edColorBtn{border:1px solid var(--line);border-radius:.35em;background:var(--curColor,var(--ivory))!important;width:1.7em;height:1.7em}
.edmain{flex:1;overflow:auto;position:relative;min-height:0}
#edBody{
  min-height:100%;padding:.45em .7em 2em;font-size:var(--note);font-weight:var(--notefw);line-height:1.4;
  outline:none;color:var(--text);background:transparent;border:none;
  user-select:text;-webkit-user-select:text; -webkit-touch-callout:default;
}
#edBody:empty:before{content:attr(data-ph);color:var(--sub)}

#selBar{position:fixed;z-index:95;display:flex;gap:.15em;background:var(--card);
  border:1px solid var(--line);border-radius:.6em;box-shadow:var(--shadow);
  padding:.25em;opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity .15s,transform .15s;
  max-width:calc(100vw - 12px);flex-wrap:wrap}
#selBar.show{opacity:1;visibility:visible;transform:translateY(0)}
#selBar .tb{background:var(--chip);border:1px solid var(--line);color:var(--text);border-radius:.4em;
  min-width:1.9em;height:1.9em;font-size:.78em;font-weight:600}

#edTypePop{position:absolute;z-index:70;top:2.6em;right:.4em;background:var(--card);
  border:1px solid var(--line);border-radius:.6em;box-shadow:var(--shadow);
  padding:.5em .6em;width:min(92vw,280px);
  opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .16s,transform .16s}
#edTypePop.show{opacity:1;visibility:visible;transform:translateY(0)}
.tprow{display:flex;align-items:center;gap:.4em;margin:.28em 0;flex-wrap:wrap}
.tplab{font-size:.6em;color:var(--sub);font-weight:600;width:3.1em;flex:none}
.tpbtn{background:var(--chip);border:1px solid var(--line);color:var(--text);border-radius:.4em;padding:.32em .7em;font-size:.78em;font-weight:600}
.tpval{min-width:2.6em;text-align:center;font-size:.78em;font-weight:700}

.fontstep{display:flex;align-items:center;gap:.35em}
.fsbtn{background:var(--chip);border:1px solid var(--line);color:var(--text);border-radius:.4em;width:2.1em;height:2.1em;font-size:.85em;font-weight:700}
.fsval{min-width:2em;text-align:center;font-size:1em;font-weight:700}
.fsunit{font-size:.6em;color:var(--sub)}
.fontsample{margin:.4em 0 .6em;padding:.45em .7em;background:var(--card);border:1px dashed var(--line);
  border-radius:.5em;color:var(--text);line-height:1.4;text-align:center}

#edColorPop{position:absolute;z-index:70;top:2.6em;right:.4em;background:var(--card);
  border:1px solid var(--line);border-radius:.7em;box-shadow:var(--shadow);
  padding:.5em;display:flex;gap:.4em;opacity:0;visibility:hidden;transform:translateY(-6px);transition:.18s}
#edColorPop.show{opacity:1;visibility:visible;transform:translateY(0)}
#edColorPop .swatch{width:1.7em;height:1.7em;border-radius:50%;border:2px solid var(--line)}
#edColorPop .swatch.on{border:3px solid var(--text)}

#edMenu{position:absolute;z-index:70;top:2.6em;right:.4em;background:var(--card);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:.35em;min-width:12.5em;
  opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);transition:.2s}
#edMenu.show{opacity:1;visibility:visible;transform:translateY(0) scale(1)}

#selMode{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--accent);color:var(--white);
  display:flex;align-items:center;gap:.4em;padding:calc(.5em + env(safe-area-inset-top)) .6em .5em;
  transform:translateY(-110%);transition:transform .22s ease}
#selMode.show{transform:translateY(0)}
#selMode .cnt{flex:1;font-weight:700;font-size:.8em}
#selMode .sbtn{background:rgba(255,255,255,.25);border:none;color:var(--white);border-radius:.5em;
  padding:.4em .7em;font-size:.75em;font-weight:600}

.setsec{background:var(--card);border:1px solid var(--line);border-radius:.8em;padding:.6em;margin-bottom:.5em}
.setsec h4{margin:0 0 .5em;font-size:.62em;color:var(--sub);font-weight:700;text-transform:uppercase}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:.5em;padding:.35em 0;font-size:.78em;flex-wrap:wrap}
.setrow label{font-weight:600}
select,input[type=text],input[type=password],input[type=email]{
  background:var(--chip);color:var(--text);border:1px solid var(--line);border-radius:.4em;
  padding:.45em .5em;font-size:.75em;outline:none
}
.setrow input[type=text]{flex:1;min-width:9em}
.field{display:flex;flex-direction:column;gap:.3em;margin-bottom:.5em}
.field label{font-size:.62em;font-weight:700;color:var(--sub)}
.field input{width:100%}
.hint{font-size:.6em;color:var(--sub);line-height:1.5;margin-top:.3em}
.stat{font-size:.65em;color:var(--sub);min-height:1em}

#toast{
  position:fixed;left:50%;bottom:5em;transform:translateX(-50%) translateY(10px);z-index:120;
  background:var(--card);color:var(--text);border:1px solid var(--line);padding:.5em .9em;border-radius:1.2em;
  font-size:.68em;box-shadow:var(--shadow);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:85vw;text-align:center
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.appver{margin:.7em 0 .2em;font-size:.62em;color:var(--sub);text-align:center;line-height:1.7;border-top:1px solid var(--line);padding-top:.8em}
.dfcolors{display:flex;gap:.5em;align-items:center;flex-wrap:wrap}
.dfcolors .sw{width:1.8em;height:1.8em;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;flex:none}
.dfcolors .sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--card)}
</style>
</head>
<body>

<div id="selMode">
  <button class="sbtn" id="selCancel">✕ Cancel</button>
  <span class="cnt" id="selCount">0 selected</span>
  <button class="sbtn" id="selRestore" style="display:none">↩︎ Restore</button>
  <button class="sbtn" id="selDelete">🗑️ Delete</button>
</div>

<header>
  <div class="hrow">
    <span class="logo" id="logoText">SK Notes</span>
    <span class="verbadge" id="appVer">v6.1</span>
    <input id="search" type="search" placeholder="Search...">
    <span class="syncdot" id="syncDot" title="Sync Status"></span>
    <button class="iconbtn" id="btnView" title="View mode">▦</button>
    <button class="iconbtn" id="btnTrash" title="Trash">🗑️</button>
    <button class="iconbtn" id="btnSettings" title="Settings">⚙️</button>
  </div>
</header>

<main>
  <div id="grid"></div>
  <div id="emptyMsg" class="empty hidden"></div>
</main>

<nav id="folderNav">
  <button id="fab" title="Add">+</button>
  <div class="folderbar" id="folderBar"></div>
</nav>

<div id="addMenu">
  <div class="menucard">
    <div class="menuhead">Add</div>
    <button class="menuitem" id="addNote"><span class="emo">📝</span> Note</button>
    <button class="menuitem" id="addCheck"><span class="emo">☑️</span> Checklist</button>
  </div>
</div>

<div id="toast"></div>

<div id="edOverlay">
  <div class="edpanel">
    <div class="edbar">
      <input id="edTitle" placeholder="Title">
      <button class="edtool" id="edSaveBtn" title="Save">✓</button>
      <button class="edtool undo" id="edUndo" title="Undo">↶</button>
      <button class="edtool" id="edPencil" title="Edit mode">
        <svg viewBox="0 0 512 512" width="1.15em" height="1.15em" aria-hidden="true"><path fill="currentColor" d="M290.74 93.24l128.02 128.02-277.99 277.99-114.14 12.6C11.35 513.54-1.56 500.62.14 485.34l12.7-114.22 277.9-277.88zm207.2-19.06l-60.11-60.11c-18.75-18.75-49.16-18.75-67.91 0l-56.55 56.55 128.02 128.02 56.55-56.55c18.75-18.76 18.75-49.15 0-67.91z"/></svg>
      </button>
      <button class="edtool" id="edTypeBtn" title="Format">T</button>
      <button class="edtool" id="edImgBtn" title="Image">📷</button>
      <button class="edtool" id="edColorBtn" title="Color"></button>
      <button class="edtool" id="edKebab" title="More">⋮</button>
      <input type="file" id="edImgFile" accept="image/*" style="display:none">
      <div id="edColorPop"></div>
      <div id="edTypePop"></div>
      <div id="edMenu"></div>
    </div>
    <div class="edmain">
      <div id="edBody" class="viewmode" contenteditable="true" data-ph="Type something..."></div>
    </div>
  </div>
</div>

<div id="selBar">
  <button class="tb b" data-cmd="bold">B</button>
  <button class="tb i" data-cmd="italic">I</button>
  <button class="tb u" data-cmd="underline">U</button>
  <button class="tb s" data-cmd="strikeThrough">S</button>
</div>

<!-- 설정 팝업창 -->
<div class="overlay" id="setOverlay">
  <div class="sheet">
    <h3><span>⚙️ Settings</span>
      <span>
        <button class="btn primary" id="setSave">Save</button>
        <button class="iconbtn" id="setClose">✕</button>
      </span>
    </h3>

    <div class="setsec">
      <h4>Display</h4>
      <div class="setrow"><label>Language</label>
        <select id="stLang">
          <option value="en">English</option>
          <option value="ko">한국어</option>
        </select>
      </div>
      <div class="setrow"><label>Theme</label>
        <select id="stTheme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select>
      </div>
      <div class="setrow"><label>Default View</label>
        <select id="stView"><option value="grid">Grid</option><option value="list">List</option><option value="titles">Titles only</option></select>
      </div>
      <div class="setrow">
        <label>Note Font Size (10–25pt)</label>
        <div style="display:flex; align-items:center; gap:0.4em;">
          <div class="fontstep">
            <button type="button" class="fsbtn" id="stFontMinus">−</button>
            <span class="fsval" id="stFontVal">14</span><span class="fsunit">pt</span>
            <button type="button" class="fsbtn" id="stFontPlus">＋</button>
          </div>
          <!-- 폰트 사이즈 옆 빈 여백에 컬러 팔레트 및 초기화(원점) 아이콘 배치 -->
          <button type="button" class="btn" id="stPaletteBtn" title="Color Palette">🎨</button>
          <button type="button" class="btn danger" id="stResetBtn" title="Reset All">🔄</button>
        </div>
      </div>
      <div class="fontsample" id="stFontSample">Sample Abc 123 — preview</div>
    </div>
  </div>
</div>

<script>
'use strict';
/* 7가지 고정 파스텔 컬러 팔레트 정의 */
const PALETTE = ['#E1DAD3', '#E4C9B6', '#D7A49A', '#B8BBA3', '#A4B1BA', '#C9C3DD', '#FFFFFF'];
const HEADERS = ['#D4CBC3', '#D6BCAB', '#C9978D', '#ABAB95', '#98A4AD', '#BCB4D4', '#EAE6E1'];

let S = { notes: [], folders: [], settings: { lang: 'en', theme: 'auto', font: '14', view: 'grid' } };

function initApp() {
  const saved = localStorage.getItem('sk_v6_notes');
  if (saved) { try { S = JSON.parse(saved); } catch(e){} }
  setupListeners();
  render();
}

function setupListeners() {
  document.getElementById('stFontPlus').onclick = () => {
    let f = parseInt(S.settings.font) || 14;
    if(f < 25) f++;
    S.settings.font = String(f);
    document.getElementById('stFontVal').textContent = f;
    applySettings();
  };
  document.getElementById('stFontMinus').onclick = () => {
    let f = parseInt(S.settings.font) || 14;
    if(f > 10) f--;
    S.settings.font = String(f);
    document.getElementById('stFontVal').textContent = f;
    applySettings();
  };
  // 초기화 버튼 이벤트 (원점 복귀)
  document.getElementById('stResetBtn').onclick = () => {
    if(confirm('Reset all settings and data to default?')) {
      localStorage.clear();
      location.reload();
    }
  };
  document.getElementById('btnSettings').onclick = () => {
    document.getElementById('setOverlay').classList.add('show');
  };
  document.getElementById('setClose').onclick = () => {
    document.getElementById('setOverlay').classList.remove('show');
  };
  document.getElementById('setSave').onclick = () => {
    localStorage.setItem('sk_v6_notes', JSON.stringify(S));
    document.getElementById('setOverlay').classList.remove('show');
    alert('Saved successfully.');
  };
}

function applySettings() {
  document.documentElement.style.setProperty('--note', S.settings.font + 'pt');
}

function render() {
  applySettings();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if (S.notes.length === 0) {
    document.getElementById('emptyMsg').textContent = S.settings.lang === 'ko' ? '노트가 없습니다. ＋를 눌러 추가하세요.' : 'No notes yet. Tap ＋ to create one.';
    document.getElementById('emptyMsg').classList.remove('hidden');
  } else {
    document.getElementById('emptyMsg').classList.add('hidden');
    S.notes.forEach((n, idx) => {
      const card = document.createElement('div');
      card.className = 'note';
      const colIdx = n.color % PALETTE.length;
      card.style.setProperty('--nc', PALETTE[colIdx]);
      card.innerHTML = `<div class="thead" style="background:${HEADERS[colIdx]}"><span class="ttl">${n.title || 'Untitled'}</span></div><div class="tinner"><div class="body">${n.body || ''}</div></div>`;
      grid.appendChild(card);
    });
  }
}

document.getElementById('fab').onclick = () => {
  S.notes.push({ id: Date.now(), title: 'New Note', body: 'Sample content...', color: Math.floor(Math.random() * PALETTE.length) });
  localStorage.setItem('sk_v6_notes', JSON.stringify(S));
  render();
};

initApp();
</script>
</body>
</html>
